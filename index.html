<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="María Sánchez Domínguez — computational designer. BIM, automation and the people who use them." />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <title>María Sánchez Domínguez</title>
    <script>
      // pick the theme before the page paints: a remembered choice, else the
      // system setting, else light
      var t = 'light'
      try { t = localStorage.getItem('theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (e) { t = 'light' }
      }
      document.documentElement.dataset.theme = t
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
