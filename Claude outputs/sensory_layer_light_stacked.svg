<text x="386" y="116" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#141414">THE SENSES</text>
<rect x="524" y="97" width="68" height="25" rx="12.5" fill="none" stroke="#c99a1c" stroke-width="1.4"/>
<text x="558" y="114" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a37a0a" text-anchor="middle">+ new</text>
<text x="386" y="142" font-family="'JetBrains Mono', monospace" font-size="15" fill="#6b6b6b">six senses, personal, coupled</text>
<text x="386" y="210" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8a8a8a">energy</text>
<text x="386" y="294" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8a8a8a">cost</text>
<text x="386" y="378" font-family="'JetBrains Mono', monospace" font-size="17" fill="#8a8a8a">structure</text>
<text x="386" y="462" font-family="'JetBrains Mono', monospace" font-size="17" fill="#3a3a3a">the floor plan</text>
<text x="120" y="566" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" letter-spacing="1.4" fill="#6b6b6b">THE SENSORY LAYER IS</text>
<circle cx="128" cy="612" r="6" fill="none" stroke="#c99a1c" stroke-width="2.2"/>
<text x="154" y="618" font-family="Inter, sans-serif" font-weight="600" font-size="21" fill="#141414">personal</text>
<text x="154" y="648" font-family="Inter, sans-serif" font-size="19" fill="#5c5c5c">scored for one person, never an average</text>
<path d="M 128 690 L 136 705 L 120 705 Z" fill="none" stroke="#d9542f" stroke-width="1.8" stroke-linejoin="round"/>
<text x="154" y="704" font-family="Inter, sans-serif" font-weight="600" font-size="21" fill="#141414">honest</text>
<text x="154" y="734" font-family="Inter, sans-serif" font-size="19" fill="#5c5c5c">no averaging; the worst sense carries the weight</text>
<path d="M 120 787 C 123 779 127 779 128 784 C 129 789 133 789 136 781" fill="none" stroke="#7d70d0" stroke-width="2" stroke-linecap="round"/>
<text x="154" y="790" font-family="Inter, sans-serif" font-weight="600" font-size="21" fill="#141414">coupled</text>
<text x="154" y="820" font-family="Inter, sans-serif" font-size="19" fill="#5c5c5c">the senses pull on each other</text>
