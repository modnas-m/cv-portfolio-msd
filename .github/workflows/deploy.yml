name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # With a custom domain (repo variable CUSTOM_DOMAIN, e.g. mariasanchez.com)
      # the site lives at the domain's root; otherwise at /<repo name>/ on github.io.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}/', github.event.repository.name) }}
      - if: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      # GitHub Pages has no SPA routing: serve the app for unknown paths too
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
